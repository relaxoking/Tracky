  <script>
    // Zeigt Fehler direkt auf dem Bildschirm statt einer leeren Seite (hilft beim Debuggen per Screenshot)
    window.addEventListener("error", function (e) {
      var s = document.getElementById("status");
      if (s) s.textContent = "Fehler beim Start:\n" + (e.message || e.error || "unbekannt");
    });
    setTimeout(function () {
      var s = document.getElementById("status");
      if (s && s.textContent.indexOf("Lade") === 0) s.textContent = "Die App konnte nicht starten. Internetverbindung prüfen und Seite neu laden.";
    }, 10000);

    // IndexedDB-Speicher mit derselben get/set-Schnittstelle wie zuvor im Chat-Artefakt
    (function () {
      var DB_NAME = "tracky-storage", STORE = "kv";
      function openDB() {
        return new Promise(function (resolve, reject) {
          var req = indexedDB.open(DB_NAME, 1);
          req.onupgradeneeded = function () { req.result.createObjectStore(STORE); };
          req.onsuccess = function () { resolve(req.result); };
          req.onerror = function () { reject(req.error); };
        });
      }
      window.storage = {
        get: function (key) {
          return openDB().then(function (db) {
            return new Promise(function (resolve, reject) {
              var req = db.transaction(STORE, "readonly").objectStore(STORE).get(key);
              req.onsuccess = function () { resolve(req.result !== undefined ? { key: key, value: req.result, shared: false } : null); };
              req.onerror = function () { reject(req.error); };
            });
          });
        },
        set: function (key, value) {
          return openDB().then(function (db) {
            return new Promise(function (resolve, reject) {
              var tx = db.transaction(STORE, "readwrite");
              tx.objectStore(STORE).put(value, key);
              tx.oncomplete = function () { resolve({ key: key, value: value, shared: false }); };
              tx.onerror = function () { reject(tx.error); };
            });
          });
        }
      };
    })();
  </script>

const todayISO = () => new Date().toISOString().slice(0, 10);
const fmtDate = (iso) => {
  const d = new Date(iso + "T00:00:00");
  return `${String(d.getDate()).padStart(2, "0")}.${String(d.getMonth() + 1).padStart(2, "0")}.${d.getFullYear()}`;
};
const startOfWeek = (d) => {
  const date = new Date(d);
  const day = (date.getDay() + 6) % 7;
  date.setDate(date.getDate() - day);
  date.setHours(0, 0, 0, 0);
  return date;
};
const weekKey = (d) => startOfWeek(d).toISOString().slice(0, 10);
const weekLabel = (d) => `${d.getDate()}.${d.getMonth() + 1}.`;
const scoreColor = (score) => (score == null ? C.muted : score >= 4 ? C.green : score >= 3 ? C.yellow : C.red);
const calcScore = (feeling, focus, sleep) => {
  const vals = [feeling, focus, sleep].filter((v) => v != null && v !== "");
  if (!vals.length) return null;
  return vals.reduce((a, b) => a + Number(b), 0) / vals.length;
};
const getExRange = (library, name) => {

// ---------- Trainingsplan-Engine (grobe, transparente Faustregeln) ----------
const PHASE_LABELS = { base: "Grundlage", build: "Aufbau", peak: "Spitze", taper: "Taper" };
const RUN_TYPE_LABELS = { grundlage: "Grundlagenlauf", tempo: "Tempo/Schwelle", intervalle: "Intervalle", regeneration: "Regeneration" };
const SWIM_TYPE_LABELS = { ausdauer: "Ausdauer", technik: "Technik/Drills", tempo: "Tempo" };
const RUN_ZONE = { grundlage: 2, tempo: 3, intervalle: 4, regeneration: 1 };
const SWIM_ZONE = { ausdauer: 2, technik: 1, tempo: 3 };

const getPhase = (goal) => {
  if (!goal?.date) return null;
  const weeksLeft = Math.ceil((new Date(goal.date + "T00:00:00") - new Date(todayISO() + "T00:00:00")) / (7 * 86400000));
  if (weeksLeft <= 0) return null;
  if (weeksLeft <= 2) return "taper";
  if (weeksLeft <= 4) return "peak";
  if (weeksLeft <= 12) return "build";
  return "base";
};

// Empfiehlt die heutige Laufeinheit: berücksichtigt Phase, hart/leicht-Rhythmus und
// die 10%-Regel fürs Wochenvolumen. Bewusst als transparente Faustregel, kein Blackbox-Algorithmus.
function getRunRecommendation(entries, goal) {
  const phase = getPhase(goal) || "base";
  const runs = entries.filter((e) => e.discipline === "run").sort((a, b) => a.date.localeCompare(b.date));
  const weekNow = weekKey(startOfWeek(new Date()));
  const thisWeek = runs.filter((e) => weekKey(new Date(e.date)) === weekNow);
  const lastRun = runs[runs.length - 1];
  const lastWasHard = lastRun && (lastRun.trainingType === "tempo" || lastRun.trainingType === "intervalle");

  const prevWeekKey = weekKey(new Date(startOfWeek(new Date()).getTime() - 7 * 86400000));
  const prevWeekVolume = runs.filter((e) => weekKey(new Date(e.date)) === prevWeekKey).reduce((s, e) => s + e.duration, 0);

  let type;
  if (thisWeek.length === 0) type = phase === "taper" ? "regeneration" : lastWasHard ? "grundlage" : (phase === "build" || phase === "peak") ? "tempo" : "grundlage";
  else if (thisWeek.length === 1) type = lastWasHard || phase === "taper" ? "grundlage" : phase === "peak" ? "intervalle" : "tempo";
  else type = phase === "taper" ? "regeneration" : "grundlage"; // 3. Einheit: eher der lange, ruhige Lauf

  const weekTarget = prevWeekVolume > 0 ? prevWeekVolume * (phase === "taper" ? 0.6 : 1.1) : 90;
  const thisWeekVolume = thisWeek.reduce((s, e) => s + e.duration, 0);
  const remainingSessions = Math.max(1, 3 - thisWeek.length);
  const targetDuration = Math.max(20, Math.min(150, Math.round(Math.max(20, weekTarget - thisWeekVolume) / remainingSessions)));

  return { phase, type, hrZone: RUN_ZONE[type], targetDuration };
}

const round05 = (x) => Math.round(x * 20) / 20;

// Schwimmen: fixe 1x/Woche, rotiert durch Ausdauer/Technik/Tempo, Taper geht auf Technik zurück.
// Gibt jetzt konkrete Segmente vor: welche Technik, wie viele km, locker oder zügig.
function getSwimRecommendation(entries, goal) {
  const phase = getPhase(goal) || "base";
  const swims = entries.filter((e) => e.discipline === "swim").sort((a, b) => a.date.localeCompare(b.date));
  const rotation = ["ausdauer", "technik", "tempo"];
  const type = phase === "taper" ? "technik" : rotation[swims.length % rotation.length];
  const last = swims[swims.length - 1];

  let totalDistance = last?.distance ? last.distance * (phase === "taper" ? 0.8 : 1.05) : 1;
  if (type === "technik") totalDistance *= 0.7;
  totalDistance = round05(totalDistance);

  let segments;
  if (type === "ausdauer") {
    segments = [
      { technique: "kraul", distance: round05(totalDistance * 0.8), intensity: "locker" },
      { technique: "brust", distance: round05(totalDistance * 0.2), intensity: "locker" },
    ];
  } else if (type === "technik") {
    segments = [
      { technique: "kraul", distance: round05(totalDistance * 0.5), intensity: "locker" },
      { technique: "brust", distance: round05(totalDistance * 0.5), intensity: "locker" },
    ];
  } else {
    segments = [
      { technique: "kraul", distance: round05(totalDistance * 0.2), intensity: "locker" },
      { technique: "kraul", distance: round05(totalDistance * 0.6), intensity: "zügig" },
      { technique: "brust", distance: round05(totalDistance * 0.2), intensity: "locker" },
    ];
  }

  const paces = swims.filter((e) => e.distance).map((e) => e.duration / (e.distance * 10));
  const avgPace100 = paces.length ? paces.reduce((a, b) => a + b, 0) / paces.length : 2.3;
  const segmentsTotal = segments.reduce((s, x) => s + x.distance, 0);
  const targetDuration = Math.round(segmentsTotal * 10 * avgPace100);

  return { phase, type, hrZone: SWIM_ZONE[type], segments, totalDistance: segmentsTotal, targetDuration };
}

// Schwimmen wird traditionell in Pace/100m gemessen, Laufen in Pace/km
const paceLabel = (discipline, distance, duration) => {
  if (discipline === "swim") return `${(duration / (distance * 10)).toFixed(1)} min/100m`;
  return `${(duration / distance).toFixed(1)} min/km`;
};

// ---------- Ernährungs-Engine (grobe, transparente Faustregeln – kein medizinischer Rat) ----------
const NUTRITION_GOALS = { aufbau: "Muskelaufbau", definition: "Definition", erhalt: "Erhalt" };
// "Regenbogen"-Farbgruppen als praktikabler Mikronährstoff-/Antioxidantien-Proxy statt exakter µg-Werte
const COLOR_TAGS = ["Grün", "Rot", "Orange/Gelb", "Blau/Violett", "Weiß/Braun"];
const MEAL_TYPES = { fruehstueck: "Frühstück", mittag: "Mittag", abend: "Abend", snack: "Snack" };

const getLastWeekTrainingHours = (entries) => {
  const wk = weekKey(new Date(startOfWeek(new Date()).getTime() - 7 * 86400000));
  return entries.filter((e) => weekKey(new Date(e.date)) === wk).reduce((s, e) => s + (Number(e.duration) || 0), 0) / 60;
};

// Grobe TDEE-Schätzung über kcal/kg-Faustregel, skaliert mit Trainingsstunden der Vorwoche
function estimateTDEE(weightKg, weeklyHours) {
  const factor = weeklyHours < 3 ? 28 : weeklyHours < 6 ? 32 : weeklyHours < 10 ? 36 : 40;
  return Math.round(weightKg * factor);
}

function computeMacroTargets(weightKg, weeklyHours, goalType, calorieAdjustment = 0) {
  const goalOffsets = { aufbau: 300, definition: -400, erhalt: 0 };
  const calories = Math.max(1200, estimateTDEE(weightKg, weeklyHours) + (goalOffsets[goalType] || 0) + calorieAdjustment);
  const proteinPerKg = goalType === "definition" ? 2.2 : goalType === "aufbau" ? 1.9 : 1.8;
  const protein = Math.round(weightKg * proteinPerKg);
  const fat = Math.round((calories * 0.25) / 9);
  const carbs = Math.max(0, Math.round((calories - protein * 4 - fat * 9) / 4));
  const fiber = Math.round((calories / 1000) * 14);
  return { calories: Math.round(calories), protein, carbs, fat, fiber };
}

// Wöchentliche Anpassung: vergleicht den tatsächlichen Gewichtstrend der letzten 7 Tage mit dem
// fürs Ziel erwarteten Trend und korrigiert die Kalorien leicht. Ergänzt einen Hinweis, falls die
// Session-Qualität der letzten Woche (Gefühl/Fokus) niedrig war – als Denkanstoß, nicht als Formel-Input.
function getWeeklyAdjustment(bodyStats, entries, goalType) {
  const sorted = [...bodyStats].sort((a, b) => a.date.localeCompare(b.date));
  const now = new Date();
  const weekAgo = new Date(now - 7 * 86400000);
  const twoWeeksAgo = new Date(now - 14 * 86400000);
  const recent = sorted.filter((b) => new Date(b.date + "T00:00:00") >= weekAgo);
  const prior = sorted.filter((b) => { const d = new Date(b.date + "T00:00:00"); return d >= twoWeeksAgo && d < weekAgo; });
  let adjustment = 0;
  let note = null;
  if (recent.length && prior.length) {
    const avg = (arr) => arr.reduce((s, b) => s + b.weight, 0) / arr.length;
    const change = avg(recent) - avg(prior);
    const expected = { aufbau: 0.15, definition: -0.5, erhalt: 0 }[goalType];
    const diff = change - expected;
    if (diff < -0.15) { adjustment = 150; note = `Gewichtstrend (${change.toFixed(1)}kg/Wo.) schwächer als fürs Ziel erwartet → Kalorien leicht erhöht.`; }
    else if (diff > 0.15) { adjustment = -150; note = `Gewichtstrend (${change.toFixed(1)}kg/Wo.) stärker als fürs Ziel erwartet → Kalorien leicht gesenkt.`; }
  } else {
    note = "Noch zu wenig Gewichtsdaten (mind. 2 Wochen) für eine automatische Anpassung.";
  }
  const weekNow = weekKey(startOfWeek(new Date()));
  const lastWeekEntries = entries.filter((e) => weekKey(new Date(e.date)) === weekKey(new Date(startOfWeek(new Date()).getTime() - 7 * 86400000)));
  const scores = lastWeekEntries.map((e) => e.sessionScore).filter((s) => s != null);
  if (scores.length) {
    const avgScore = scores.reduce((a, b) => a + b, 0) / scores.length;
    if (avgScore < 3 && goalType === "definition") note = `${note ? note + " " : ""}Ø Session-Score letzte Woche war niedrig (${avgScore.toFixed(1)}/5) bei einem Kaloriendefizit – ggf. ist das Defizit aktuell zu groß.`;
  }
  return { adjustment, note };
}

// Im Standalone-Build (GitHub Pages) gibt es keinen eingebetteten Anthropic-API-Zugang mehr wie
// im Chat-Artefakt – ein echter API-Key dürfte aus Sicherheitsgründen nicht im Frontend stehen.
// Foto-Schätzung/Rezeptvorschlag brauchen dafür einen eigenen kleinen Server (wie bei Strava
// besprochen). Bis dahin schlägt der Aufruf bewusst mit einer klaren Meldung fehl, statt
// stillschweigend nichts zu tun.
async function callClaudeJSON(promptText, imageBase64) {
  throw new Error("In dieser Version (GitHub Pages) noch nicht verfügbar – braucht einen eigenen Server für den API-Zugang.");
  // Referenzcode für später, sobald ein eigener Server/Proxy existiert:
  const content = [];
  if (imageBase64) content.push({ type: "image", source: { type: "base64", media_type: "image/jpeg", data: imageBase64 } });
  content.push({ type: "text", text: promptText });
  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ model: "claude-sonnet-4-6", max_tokens: 1000, messages: [{ role: "user", content }] }),
  });
  const data = await response.json();
  const text = (data.content || []).map((b) => b.text || "").join("");
  const clean = text.replace(/```json|```/g, "").trim();
  return JSON.parse(clean);
}

async function loadKey(key, fallback) {
  try {
    const res = await window.storage.get(key, false);
    return res ? JSON.parse(res.value) : fallback;
  } catch {
    return fallback;
  }
}
async function saveKey(key, value) {
  try {
    await window.storage.set(key, JSON.stringify(value), false);
    return true;
  } catch {
    return false;
  }
}

// Gezielter Selbsttest: schreibt einen Testwert und liest ihn direkt wieder – anders als bei
// normalen loadKey-Aufrufen (wo "Key existiert noch nicht" völlig normal ist) zeigt das
// zuverlässig, ob Speichern/Lesen hier tatsächlich funktioniert.
async function testStoragePersistence() {
  const testKey = "__storage_healthcheck__";
  const marker = String(Date.now());
  try {
    await window.storage.set(testKey, marker, false);
  } catch (e) {
    return { ok: false, stage: "Schreiben", error: String(e?.message || e) };
  }
  try {
    const res = await window.storage.get(testKey, false);
    if (res && res.value === marker) return { ok: true };
    return { ok: false, stage: "Lesen", error: "Gelesener Wert stimmt nicht mit dem gespeicherten überein." };
  } catch (e) {
    return { ok: false, stage: "Lesen", error: String(e?.message || e) };
  }
}

// ---------- eigene, abhängigkeitsfreie Charts (ersetzen recharts für den Standalone-Build) ----------
function StackedBarChart({ data, series, height = 160 }) {
  const W = 300, H = height, padBottom = 16, padTop = 4;
  const max = Math.max(1, ...data.map((d) => series.reduce((s, sr) => s + (Number(d[sr.key]) || 0), 0)));
  const n = data.length || 1;
  const gap = 4;
  const barW = (W - gap * (n + 1)) / n;
  return (
    <div>
      <svg viewBox={`0 0 ${W} ${H}`} style={{ width: "100%", height: "auto", display: "block" }}>
        <line x1="0" y1={H - padBottom} x2={W} y2={H - padBottom} stroke={C.border} strokeWidth="1" />
        {data.map((d, i) => {
          const x = gap + i * (barW + gap);
          let y = H - padBottom;
          return (
            <g key={i}>
              {series.map((sr) => {
                const v = Number(d[sr.key]) || 0;
                if (!v) return null;
                const h = (v / max) * (H - padBottom - padTop);
                y -= h;
                return <rect key={sr.key} x={x} y={y} width={barW} height={h} fill={sr.color} rx="1.5" />;
              })}
              <text x={x + barW / 2} y={H - 4} fontSize="7" fill={C.muted} textAnchor="middle">{d.label}</text>
            </g>
          );
        })}
      </svg>
      <div style={{ display: "flex", gap: 10, flexWrap: "wrap", marginTop: 8 }}>
        {series.map((sr) => (
          <span key={sr.key} style={{ fontSize: 10, color: C.muted, display: "flex", alignItems: "center", gap: 4 }}>
            <span style={{ width: 8, height: 8, borderRadius: 2, background: sr.color, display: "inline-block" }} /> {sr.label}
          </span>
        ))}
      </div>
    </div>
  );
}

function HBarChart({ data, color, unit = "" }) {
  const W = 300, rowH = 22, padLeft = 74;
  const H = Math.max(1, data.length) * rowH + 8;
  const max = Math.max(1, ...data.map((d) => Number(d.value) || 0));
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{ width: "100%", height: "auto", display: "block" }}>
      {data.map((d, i) => {
        const w = ((Number(d.value) || 0) / max) * (W - padLeft - 30);
        const y = i * rowH + 6;
        return (
          <g key={i}>
            <text x={padLeft - 6} y={y + 11} fontSize="7" fill={C.muted} textAnchor="end">{d.label}</text>
            <rect x={padLeft} y={y} width={Math.max(w, 1)} height={14} fill={color} rx="2" />
            <text x={padLeft + w + 4} y={y + 11} fontSize="7" fill={C.text}>{d.value}{unit}</text>
          </g>
        );
      })}
    </svg>
  );
}

function LineChartSimple({ data, color }) {
  const W = 300, H = 120, pad = 10;
  const values = data.map((d) => d.weight);
  const min = Math.min(...values), max = Math.max(...values);
  const range = max - min || 1;
  const stepX = (W - pad * 2) / (data.length - 1 || 1);
  const points = data.map((d, i) => {
    const x = pad + i * stepX;
    const y = H - pad - ((d.weight - min) / range) * (H - pad * 2);
    return `${x},${y}`;
  });
  const everyNth = Math.max(1, Math.ceil(data.length / 6));
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{ width: "100%", height: "auto", display: "block" }}>
      <polyline points={points.join(" ")} fill="none" stroke={color} strokeWidth="2" />
      {points.map((p, i) => {
        const [x, y] = p.split(",");
        return <circle key={i} cx={x} cy={y} r="2.5" fill={color} />;
      })}
      {data.map((d, i) => (i % everyNth === 0 ? <text key={i} x={pad + i * stepX} y={H - 1} fontSize="6" fill={C.muted} textAnchor="middle">{d.label}</text> : null))}
    </svg>
  );
}

  const [distance, setDistance] = useState("");
  const [avgHR, setAvgHR] = useState("");
  const [note, setNote] = useState("");
  const [feeling, setFeeling] = useState(null);
  const [focus, setFocus] = useState(null);
  const [sleep, setSleep] = useState(null);
  const [music, setMusic] = useState(false);
  const [padelMatches, setPadelMatches] = useState([{ partner: "", opponent1: "", opponent2: "", result: "training", sets: [{ mine: "", theirs: "" }] }]);
  const [showPlayerManage, setShowPlayerManage] = useState(false);
  const [newPlayer, setNewPlayer] = useState("");
  const [swimSets, setSwimSets] = useState([]);
  const [trainingType, setTrainingType] = useState("");
  const [hrZone, setHrZone] = useState("");
  const [splits, setSplits] = useState([]);
  const [exercises, setExercises] = useState([{ name: "", sets: [{ reps: "", weight: "" }, { reps: "", weight: "" }] }]);
  const [weight, setWeight] = useState("");
  const [restingHR, setRestingHR] = useState("");
  const [showLibraryManage, setShowLibraryManage] = useState(false);
  const [newEx, setNewEx] = useState({ name: "", muscleGroup: MUSCLE_GROUPS[0], repLow: "6", repHigh: "8" });
  const [editingLibName, setEditingLibName] = useState(null);
  const [editDraft, setEditDraft] = useState(null);

  const resetCommon = () => {
    setDuration(""); setDistance(""); setAvgHR(""); setNote(""); setFeeling(null); setFocus(null); setSleep(null); setMusic(false);
    setPadelMatches([{ partner: "", opponent1: "", opponent2: "", result: "training", sets: [{ mine: "", theirs: "" }] }]);
    setExercises([{ name: "", sets: [{ reps: "", weight: "" }, { reps: "", weight: "" }] }]); setWeight(""); setRestingHR("");
    setTrainingType(""); setHrZone(""); setSplits([]); setSwimSets([]);
  };

  // Eintrag zum Bearbeiten in die Formularfelder laden
  useEffect(() => {
    if (!editingEntry) return;
    setTab(editingEntry.discipline);
    setDate(editingEntry.date);
    setDuration(String(editingEntry.duration));
    setNote(editingEntry.note || "");
    setFeeling(editingEntry.feeling || null);
    setFocus(editingEntry.focus || null);
    setSleep(editingEntry.sleep || null);
    setMusic(!!editingEntry.music);
    if (editingEntry.discipline === "gym") {
      setExercises((editingEntry.exercises || []).map((ex) => ({ name: ex.name, sets: ex.sets.map((s) => ({ reps: String(s.reps), weight: String(s.weight) })) })));
    } else if (editingEntry.discipline === "padel") {
      const legacyMatch = editingEntry.matches ? null : { partner: editingEntry.partner || "", opponent1: editingEntry.opponent1 || editingEntry.opponent || "", opponent2: editingEntry.opponent2 || "", result: editingEntry.result || "training", sets: editingEntry.sets || [{ mine: "", theirs: "" }] };
      const matches = editingEntry.matches && editingEntry.matches.length ? editingEntry.matches : [legacyMatch];
      setPadelMatches(matches.map((m) => ({ partner: m.partner || "", opponent1: m.opponent1 || "", opponent2: m.opponent2 || "", result: m.result || "training", sets: (m.sets && m.sets.length ? m.sets : [{ mine: "", theirs: "" }]).map((s) => ({ mine: String(s.mine), theirs: String(s.theirs) })) })));
    } else {
      setDistance(editingEntry.distance != null ? String(editingEntry.distance) : "");
      setAvgHR(editingEntry.avgHR != null ? String(editingEntry.avgHR) : "");
      setTrainingType(editingEntry.trainingType || "");
      setHrZone(editingEntry.hrZone || "");
      setSplits((editingEntry.splits || []).map((s) => ({ distance: String(s.distance), duration: String(s.duration) })));
      setSwimSets((editingEntry.swimSets || []).map((s) => ({ technique: s.technique, distance: String(s.distance), equipment: s.equipment || [], intensity: s.intensity || "locker" })));
    }
  }, [editingEntry]);

  // Bei Schwimm-Sets die Gesamtdistanz automatisch aus den Technik-Abschnitten summieren
  useEffect(() => {
    if (tab === "swim" && swimSets.length > 0) setDistance(String(Math.round(swimSetsTotal * 1000) / 1000));
  }, [swimSets]);

  const addMatch = () => setPadelMatches([...padelMatches, { partner: "", opponent1: "", opponent2: "", result: "training", sets: [{ mine: "", theirs: "" }] }]);
  const removeMatch = (i) => { if (padelMatches.length <= 1) return; setPadelMatches(padelMatches.filter((_, idx) => idx !== i)); };
  const updateMatchField = (i, field, val) => { const next = [...padelMatches]; next[i] = { ...next[i], [field]: val }; setPadelMatches(next); };
  const addMatchSet = (mIdx) => { const next = [...padelMatches]; next[mIdx] = { ...next[mIdx], sets: [...next[mIdx].sets, { mine: "", theirs: "" }] }; setPadelMatches(next); };
  const removeMatchSet = (mIdx, sIdx) => { const next = [...padelMatches]; if (next[mIdx].sets.length <= 1) return; next[mIdx] = { ...next[mIdx], sets: next[mIdx].sets.filter((_, i) => i !== sIdx) }; setPadelMatches(next); };
  const updateMatchSet = (mIdx, sIdx, field, val) => { const next = [...padelMatches]; const sets = [...next[mIdx].sets]; sets[sIdx] = { ...sets[sIdx], [field]: val }; next[mIdx] = { ...next[mIdx], sets }; setPadelMatches(next); };

  const addNewPlayer = () => {
    const name = newPlayer.trim();
    if (!name || playerLibrary.includes(name)) return;
    onAddPlayer(name);
    setNewPlayer("");
  };

  const addSwimSet = () => setSwimSets([...swimSets, { technique: "kraul", distance: "", equipment: [], intensity: "locker" }]);
  const removeSwimSet = (i) => setSwimSets(swimSets.filter((_, idx) => idx !== i));
  const updateSwimSet = (i, field, val) => { const next = [...swimSets]; next[i] = { ...next[i], [field]: val }; setSwimSets(next); };
  const toggleSwimEquipment = (i, eq) => {
    const next = [...swimSets];
    const has = next[i].equipment.includes(eq);
    next[i] = { ...next[i], equipment: has ? next[i].equipment.filter((x) => x !== eq) : [...next[i].equipment, eq] };
    setSwimSets(next);
  };
  const swimSetsTotal = swimSets.reduce((s, x) => s + (Number(x.distance) || 0), 0);

  const addSplit = () => setSplits([...splits, { distance: "", duration: "" }]);
  const removeSplit = (i) => setSplits(splits.filter((_, idx) => idx !== i));
  const updateSplit = (i, field, val) => { const next = [...splits]; next[i] = { ...next[i], [field]: val }; setSplits(next); };

  // letzte Leistung für eine Übung aus dem bisherigen Verlauf ermitteln (inkl. Sätze + Session-Score)
  const getLastPerf = (name) => {
    if (!name) return null;
    const matches = entries
      .filter((e) => e.discipline === "gym")
      .flatMap((e) => (e.exercises || []).filter((ex) => ex.name === name).map((ex) => ({ ...ex, date: e.date, sessionScore: e.sessionScore })))
      .sort((a, b) => a.date.localeCompare(b.date));
    return matches[matches.length - 1] || null;
  };

  // Progressionsregel: bei guter/unbekannter Session-Qualität normal steigern (Wdh. bis zum
  // übungseigenen Maximum, danach Gewicht hoch); war die letzte Session nicht gut, nur +1 Wdh.
  const nextTarget = (last) => {
    if (!last || !last.sets || last.sets.length === 0) return null;
    const range = getExRange(library, last.name);
    const quality = last.sessionScore == null ? "unknown" : last.sessionScore >= 3.5 ? "good" : "poor";
    const sets = last.sets.map((s) => {
      const reps = Number(s.reps) || 0, w = Number(s.weight) || 0;
      if (!reps || !w) return { reps: s.reps || "", weight: s.weight || "" };
      if (quality === "poor") return { reps: reps + 1, weight: w };
      if (reps < range.repHigh) return { reps: reps + 1, weight: w };
      const step = w >= 20 ? 2.5 : 1;
      return { reps: range.repLow, weight: w + step };
    });
    const qualityNote = quality === "poor" ? " · letzte Session war nicht optimal, daher nur Wdh. steigern" : "";
    return { sets, note: `${sets.map((s) => `${s.reps}×${s.weight}kg`).join(", ")}${qualityNote}` };
  };

  const setExerciseName = (i, name) => {
    const next = [...exercises];
    const last = getLastPerf(name);
    next[i] = { name, sets: last ? last.sets.map((s) => ({ reps: String(s.reps), weight: String(s.weight) })) : next[i].sets };
    setExercises(next);
  };
  const updateSetField = (exIdx, setIdx, field, val) => {
    const next = [...exercises];
    const sets = [...next[exIdx].sets];
    sets[setIdx] = { ...sets[setIdx], [field]: val };
    next[exIdx] = { ...next[exIdx], sets };
    setExercises(next);
  };
  const addSetRow = (exIdx) => {
    const next = [...exercises];
    next[exIdx] = { ...next[exIdx], sets: [...next[exIdx].sets, { reps: "", weight: "" }] };
    setExercises(next);
  };
  const removeSetRow = (exIdx, setIdx) => {
    const next = [...exercises];
    if (next[exIdx].sets.length <= 1) return;
    next[exIdx] = { ...next[exIdx], sets: next[exIdx].sets.filter((_, i) => i !== setIdx) };
    setExercises(next);
  };
  const applyTarget = (exIdx, target) => {
    const next = [...exercises];
    next[exIdx] = { ...next[exIdx], sets: target.sets.map((s) => ({ reps: String(s.reps), weight: String(s.weight) })) };
    setExercises(next);
  };
  const addExerciseRow = () => setExercises([...exercises, { name: "", sets: [{ reps: "", weight: "" }, { reps: "", weight: "" }] }]);

  const startEditLib = (item) => { setEditingLibName(item.name); setEditDraft({ ...item, repLow: String(item.repLow), repHigh: String(item.repHigh) }); };
  const saveEditLib = () => {
    onUpdateLibraryItem(editingLibName, { name: editDraft.name.trim(), muscleGroup: editDraft.muscleGroup, repLow: Number(editDraft.repLow) || 6, repHigh: Number(editDraft.repHigh) || 8 });
    setEditingLibName(null); setEditDraft(null);
  };

  // Empfehlung für die heutige Einheit aus der Plan-Engine (Phase, hart/leicht, 10%-Regel)
  const getRecommendation = (discipline) => (discipline === "run" ? getRunRecommendation(entries, goal) : getSwimRecommendation(entries, goal));

  const applyRecommendation = (discipline) => {
    const rec = getRecommendation(discipline);
    setTrainingType(rec.type);
    setHrZone(String(rec.hrZone));
    setDuration(String(rec.targetDuration));
    if (discipline === "swim") {
      setSwimSets(rec.segments.map((s) => ({ technique: s.technique, distance: String(s.distance), equipment: [], intensity: s.intensity })));
    }
  };

  // Letzte Session zum Vergleich (informativ, die Zielsetzung übernimmt jetzt die Plan-Engine oben)
  const getLastCardioNote = (discipline) => {
    const past = entries.filter((e) => e.discipline === discipline && e.distance && e.duration).sort((a, b) => a.date.localeCompare(b.date));
    const last = past[past.length - 1];
    if (!last) return null;
    return `Letztes Mal: ${last.distance}km in ${last.duration}min (${paceLabel(discipline, last.distance, last.duration)})`;
  };

  const submit = () => {
    if (tab === "body") {
      if (!weight) return;
      onAddBodyStat({ id: Date.now(), date, weight: Number(weight), restingHR: restingHR ? Number(restingHR) : null, note });
      resetCommon();
      return;
    }
    if (!duration) return;
    const sessionScore = calcScore(feeling, focus, sleep);
    const base = { id: editingEntry ? editingEntry.id : Date.now(), date, discipline: tab, duration: Number(duration), note, feeling, focus, sleep, music, sessionScore };
    if (tab === "gym") {
      base.exercises = exercises
        .filter((ex) => ex.name.trim())
        .map((ex) => ({ name: ex.name, sets: ex.sets.filter((s) => s.reps && s.weight).map((s) => ({ reps: Number(s.reps), weight: Number(s.weight) })) }))
        .filter((ex) => ex.sets.length > 0);
    } else if (tab === "padel") {
      base.matches = padelMatches
        .map((m) => ({ ...m, sets: m.sets.filter((s) => s.mine !== "" && s.theirs !== "").map((s) => ({ mine: Number(s.mine), theirs: Number(s.theirs) })) }))
        .filter((m) => m.partner || m.opponent1 || m.opponent2 || m.sets.length > 0);
    } else {
      base.distance = distance ? Number(distance) : null;
      base.avgHR = avgHR ? Number(avgHR) : null;
      base.trainingType = trainingType;
      base.hrZone = hrZone;
      base.splits = splits.filter((s) => s.distance && s.duration).map((s) => ({ distance: Number(s.distance), duration: Number(s.duration) }));
      base.swimSets = swimSets.filter((s) => s.distance).map((s) => ({ technique: s.technique, distance: Number(s.distance), equipment: s.equipment, intensity: s.intensity }));
      if (!editingEntry) {
        const rec = getRecommendation(tab);
        base.plannedType = rec.type;
        base.plannedHrZone = rec.hrZone;
        base.plannedDuration = rec.targetDuration;
        if (tab === "swim") base.plannedSegments = rec.segments;
        base.plannedPhase = rec.phase;
      }
    }
    if (editingEntry) onUpdateEntry(base);
    else onAddEntry(base);
    resetCommon();
  };

  const tabs = [
    ...Object.entries(DISCIPLINES).map(([key, d]) => ({ key, ...d })),
    { key: "body", label: "Körperwerte", color: C.muted, icon: Scale },
  ];

  return (
    <div className="ft-fade" style={{ display: "flex", flexDirection: "column", gap: 14 }}>
      <div style={{ display: "flex", gap: 4, overflowX: "auto" }}>
        {tabs.map((t) => {
          const Icon = t.icon;
          const active = tab === t.key;
          return (
            <button key={t.key} className={`ft-tab ${active ? "active" : ""}`} onClick={() => setTab(t.key)}>
              <Icon size={18} color={active ? t.color : C.muted} />
              {t.label}
            </button>
          );
        })}
      </div>

      <div className="ft-card" style={{ display: "flex", flexDirection: "column", gap: 10 }}>
        {editingEntry && (
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", fontSize: 12, color: C.muted }}>
            <span>Eintrag wird bearbeitet</span>
            <button className="ft-btn-ghost" onClick={onCancelEdit}>Abbrechen</button>
          </div>
        )}
        <label style={{ fontSize: 12, color: C.muted }}>
          Datum
          <input className="ft-input" style={{ marginTop: 4 }} type="date" value={date} onChange={(e) => setDate(e.target.value)} />
        </label>

        {tab === "body" ? (
          <div style={{ display: "flex", gap: 10 }}>
            <label style={{ fontSize: 12, color: C.muted, flex: 1 }}>
              Gewicht (kg)
              <input className="ft-input" style={{ marginTop: 4 }} type="number" step="0.1" value={weight} onChange={(e) => setWeight(e.target.value)} />
            </label>
            <label style={{ fontSize: 12, color: C.muted, flex: 1 }}>
              Ruhepuls (bpm)
              <input className="ft-input" style={{ marginTop: 4 }} type="number" value={restingHR} onChange={(e) => setRestingHR(e.target.value)} />
            </label>
          </div>
        ) : (
          <label style={{ fontSize: 12, color: C.muted }}>
            Dauer (Minuten)
            <input className="ft-input" style={{ marginTop: 4 }} type="number" value={duration} onChange={(e) => setDuration(e.target.value)} />
          </label>
        )}

        {(tab === "run" || tab === "swim") && (
          <>
            {(() => {
              const rec = getRecommendation(tab);
              const label = tab === "run" ? RUN_TYPE_LABELS[rec.type] : SWIM_TYPE_LABELS[rec.type];
              return (
                <div className="ft-card" style={{ background: C.surface2, borderLeft: `3px solid ${C.signal}` }}>
                  <div style={{ fontSize: 11, color: C.muted, textTransform: "uppercase", letterSpacing: "0.04em" }}>
                    Empfehlung für heute {rec.phase && `· Phase: ${PHASE_LABELS[rec.phase]}`}
                  </div>
                  <div style={{ display: "flex", alignItems: "baseline", gap: 10, marginTop: 4, flexWrap: "wrap" }}>
                    <span className="ft-display" style={{ fontSize: 20 }}>{label}</span>
                    <span className="ft-mono" style={{ color: C.signal, fontSize: 15 }}>~{rec.targetDuration} min</span>
                    <span className="ft-mono" style={{ color: C.muted, fontSize: 13 }}>Z{rec.hrZone}</span>
                  </div>
                  {tab === "swim" && (
                    <div style={{ marginTop: 6, display: "flex", flexDirection: "column", gap: 2 }}>
                      {rec.segments.map((s, i) => (
                        <span key={i} className="ft-mono" style={{ fontSize: 13, color: C.text }}>
                          {SWIM_TECHNIQUES[s.technique]}: {s.distance}km {s.intensity === "zügig" ? "· zügig" : "· locker"}
                        </span>
                      ))}
                      <span style={{ fontSize: 11, color: C.muted }}>Gesamt: {rec.totalDistance}km</span>
                    </div>
                  )}
                  <button className="ft-btn-ghost" style={{ marginTop: 8 }} onClick={() => applyRecommendation(tab)}>Übernehmen</button>
                  {!rec.phase && <div style={{ fontSize: 11, color: C.muted, marginTop: 6 }}>Ohne Zielrennen mit Datum ist das nur eine grobe Faustregel ohne Periodisierung.</div>}
                </div>
              );
            })()}
            <div style={{ display: "flex", gap: 10 }}>
              <label style={{ fontSize: 12, color: C.muted, flex: 1 }}>
                Distanz (km) {tab === "swim" && swimSets.length > 0 && <span style={{ fontSize: 10 }}>· automatisch aus Techniken</span>}
                <input className="ft-input" style={{ marginTop: 4 }} type="number" step="0.1" value={distance} readOnly={tab === "swim" && swimSets.length > 0} onChange={(e) => setDistance(e.target.value)} />
              </label>
              <label style={{ fontSize: 12, color: C.muted, flex: 1 }}>
                Ø Puls (bpm)
                <input className="ft-input" style={{ marginTop: 4 }} type="number" value={avgHR} onChange={(e) => setAvgHR(e.target.value)} />
              </label>
            </div>
            <div style={{ display: "flex", gap: 10 }}>
              <label style={{ fontSize: 12, color: C.muted, flex: 1 }}>
                Trainingsart (Ist)
                <select className="ft-input" style={{ marginTop: 4 }} value={trainingType} onChange={(e) => setTrainingType(e.target.value)}>
                  <option value="">–</option>
                  <option value="grundlage">Grundlage/Long Run</option>
                  <option value="tempo">Tempo/Schwelle</option>
                  <option value="intervalle">Intervalle</option>
                  <option value="regeneration">Regeneration</option>
                  <option value="ausdauer">Ausdauer</option>
                  <option value="technik">Technik/Drills</option>
                  <option value="wettkampf">Wettkampf</option>
                </select>
              </label>
              <label style={{ fontSize: 12, color: C.muted, flex: 1 }}>
                HF-Zone (Ist)
                <select className="ft-input" style={{ marginTop: 4 }} value={hrZone} onChange={(e) => setHrZone(e.target.value)}>
                  <option value="">–</option>
                  <option value="1">Z1 Erholung</option>
                  <option value="2">Z2 Grundlage</option>
                  <option value="3">Z3 Tempo</option>
                  <option value="4">Z4 Schwelle</option>
                  <option value="5">Z5 Maximal</option>
                </select>
              </label>
            </div>
            {(() => {
              const noteText = getLastCardioNote(tab);
              return noteText ? <div style={{ fontSize: 11, color: C.muted }}>{noteText}</div> : null;
            })()}

            {tab === "run" && (
              <div>
                <span style={{ fontSize: 12, color: C.muted }}>Abschnitte (optional, z.B. Intervalle)</span>
                {splits.map((s, i) => (
                  <div key={i} style={{ display: "flex", gap: 6, alignItems: "center", marginTop: 6 }}>
                    <span className="ft-mono" style={{ fontSize: 11, color: C.muted, width: 20, flexShrink: 0 }}>{i + 1}.</span>
                    <input className="ft-input" style={{ flex: 1 }} placeholder="km" type="number" step="0.1" value={s.distance} onChange={(e) => updateSplit(i, "distance", e.target.value)} />
                    <input className="ft-input" style={{ flex: 1 }} placeholder="min" type="number" value={s.duration} onChange={(e) => updateSplit(i, "duration", e.target.value)} />
                    <X size={14} style={{ cursor: "pointer", color: C.muted, flexShrink: 0 }} onClick={() => removeSplit(i)} />
                  </div>
                ))}
                <button className="ft-btn-ghost" style={{ marginTop: 6, padding: "4px 10px", fontSize: 11 }} onClick={addSplit}>+ Abschnitt</button>
              </div>
            )}

            {tab === "swim" && (
              <div>
                <span style={{ fontSize: 12, color: C.muted }}>Techniken &amp; Ausrüstung</span>
                {swimSets.map((s, i) => (
                  <div key={i} className="ft-card" style={{ background: C.surface2, marginTop: 6, display: "flex", flexDirection: "column", gap: 6, padding: 10 }}>
                    <div style={{ display: "flex", gap: 6 }}>
                      <select className="ft-input" style={{ flex: 2 }} value={s.technique} onChange={(e) => updateSwimSet(i, "technique", e.target.value)}>
                        {Object.entries(SWIM_TECHNIQUES).map(([k, l]) => <option key={k} value={k}>{l}</option>)}
                      </select>
                      <input className="ft-input" style={{ flex: 1 }} placeholder="km" type="number" step="0.05" value={s.distance} onChange={(e) => updateSwimSet(i, "distance", e.target.value)} />
                      <X size={14} style={{ cursor: "pointer", color: C.muted, alignSelf: "center", flexShrink: 0 }} onClick={() => removeSwimSet(i)} />
                    </div>
                    <div style={{ display: "flex", gap: 6 }}>
                      <button className={`ft-pill ${s.intensity === "locker" ? "active" : ""}`} onClick={() => updateSwimSet(i, "intensity", "locker")}>Locker</button>
                      <button className={`ft-pill ${s.intensity === "zügig" ? "active" : ""}`} onClick={() => updateSwimSet(i, "intensity", "zügig")}>Zügig</button>
                    </div>
                    <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                      {SWIM_EQUIPMENT.map((eq) => (
                        <button key={eq} className={`ft-btn-ghost ${s.equipment.includes(eq) ? "on" : ""}`} style={{ padding: "4px 10px", fontSize: 11 }} onClick={() => toggleSwimEquipment(i, eq)}>{eq}</button>
                      ))}
                    </div>
                  </div>
                ))}
                <button className="ft-btn-ghost" style={{ marginTop: 6, padding: "4px 10px", fontSize: 11 }} onClick={addSwimSet}>+ Technik-Abschnitt</button>
              </div>
            )}
          </>
        )}

        {tab === "padel" && (
          <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <span style={{ fontSize: 12, color: C.muted }}>Spieler</span>
              <button className="ft-btn-ghost" style={{ padding: "4px 10px", fontSize: 11 }} onClick={() => setShowPlayerManage((v) => !v)}>Spieler verwalten</button>
            </div>

            {showPlayerManage && (
              <div className="ft-card" style={{ background: C.surface2, display: "flex", flexDirection: "column", gap: 8 }}>
                <div style={{ display: "flex", gap: 6 }}>
                  <input className="ft-input" placeholder="Neuer Spieler" value={newPlayer} onChange={(e) => setNewPlayer(e.target.value)} onKeyDown={(e) => e.key === "Enter" && addNewPlayer()} />
                  <button className="ft-btn" style={{ padding: "8px 12px" }} onClick={addNewPlayer}><Plus size={14} /></button>
                </div>
                {playerLibrary.length === 0 ? (
                  <span style={{ fontSize: 12, color: C.muted }}>Noch keine Spieler angelegt.</span>
                ) : (
                  <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
                    {playerLibrary.map((name) => (

        })
      )}
    </div>
  );
