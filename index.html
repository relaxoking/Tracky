// ---------- progress ----------
function Progress({ entries, bodyStats, library, goal, onImportAll }) {
  const fileInputRef = React.useRef(null);

  const weeklyData = useMemo(() => {
    const weeks = [];
    for (let i = 7; i >= 0; i--) weeks.push(startOfWeek(new Date(Date.now() - i * 7 * 86400000)));
    const buckets = {};
    weeks.forEach((w) => { buckets[weekKey(w)] = { label: weekLabel(w), gym: 0, run: 0, swim: 0, padel: 0 }; });
    entries.forEach((e) => {
      const k = weekKey(new Date(e.date));
      if (buckets[k]) buckets[k][e.discipline] += (Number(e.duration) || 0) / 60;
    });
    return weeks.map((w) => ({ ...buckets[weekKey(w)], ...Object.fromEntries(Object.entries(buckets[weekKey(w)]).map(([k, v]) => [k, typeof v === "number" ? Number(v.toFixed(1)) : v])) }));
  }, [entries]);

  const weightData = useMemo(
    () => [...bodyStats].sort((a, b) => a.date.localeCompare(b.date)).map((b) => ({ label: fmtDate(b.date).slice(0, 5), weight: b.weight })),
    [bodyStats]
  );

  const pr = useMemo(() => {
    const maxOf = (disc) => Math.max(0, ...entries.filter((e) => e.discipline === disc && e.distance).map((e) => e.distance));
    const maxGym = Math.max(0, ...entries.filter((e) => e.discipline === "gym").flatMap((e) => (e.exercises || []).flatMap((ex) => (ex.sets || []).map((s) => Number(s.weight) || 0))));
    return { run: maxOf("run"), swim: maxOf("swim"), gym: maxGym };
  }, [entries]);

  const muscleVolume = useMemo(() => {
    const wk = weekKey(startOfWeek(new Date()));
    const counts = {};
    MUSCLE_GROUPS.forEach((m) => { counts[m] = 0; });
    entries.filter((e) => e.discipline === "gym" && weekKey(new Date(e.date)) === wk).forEach((e) => {
      (e.exercises || []).forEach((ex) => {
        const item = library.find((l) => l.name === ex.name);
        if (item?.muscleGroup && counts[item.muscleGroup] !== undefined) counts[item.muscleGroup] += (ex.sets || []).length;
      });
    });
    return MUSCLE_GROUPS.map((m) => ({ label: m, sets: counts[m] }));
  }, [entries, library]);

  // Persönliche Bestzeiten: Einträge werden mit 3% Toleranz einer Standard-Distanz
  // zugeordnet, die schnellste (kürzeste Dauer) davon zählt als Bestzeit
  const STANDARD_DISTANCES = { run: [1, 5, 10, 15, 21.1, 42.2], swim: [0.4, 0.75, 1, 1.5, 3.8] };
  const personalBests = useMemo(() => {
    const result = {};
    Object.entries(STANDARD_DISTANCES).forEach(([disc, distances]) => {
      result[disc] = distances.map((d) => {
        const matches = entries.filter((e) => e.discipline === disc && e.distance && Math.abs(e.distance - d) / d <= 0.03);
        if (!matches.length) return { distance: d, best: null };
        const best = matches.reduce((a, b) => (a.duration < b.duration ? a : b));
        return { distance: d, best: best.duration, paceStr: paceLabel(disc, best.distance, best.duration) };
      });
    });
    return result;
  }, [entries]);

  // Padel: Bilanz pro Partner und pro Gegner über alle Matches aller Sessions (nur Turnier-Matches zählen für die Quote)
  const padelStats = useMemo(() => {
    const tally = {};
    const bump = (name, role, result) => {
      if (!name) return;
      if (!tally[name]) tally[name] = { partner: 0, wins: 0, losses: 0, training: 0 };
      if (result === "training") tally[name].training += 1;
      else if (result === "win") tally[name].wins += 1;
      else if (result === "loss") tally[name].losses += 1;
      if (role === "partner") tally[name].partner += 1;
    };
    entries.filter((e) => e.discipline === "padel").flatMap((e) => e.matches || []).forEach((m) => {
      bump(m.partner, "partner", m.result);
      bump(m.opponent1, "opponent", m.result);
      bump(m.opponent2, "opponent", m.result);
    });
    return Object.entries(tally).map(([name, t]) => ({
      name, ...t, matches: t.wins + t.losses,
      winRate: t.wins + t.losses > 0 ? Math.round((t.wins / (t.wins + t.losses)) * 100) : null,
    })).sort((a, b) => b.matches - a.matches);
  }, [entries]);

  // Schwimmen: Kilometer pro Technik der letzten 8 Wochen
  const swimTechniqueVolume = useMemo(() => {
    const counts = {};
    Object.keys(SWIM_TECHNIQUES).forEach((t) => { counts[t] = 0; });
    entries.filter((e) => e.discipline === "swim").forEach((e) => {
      (e.swimSets || []).forEach((s) => { if (counts[s.technique] !== undefined) counts[s.technique] += Number(s.distance) || 0; });
    });
    return Object.entries(SWIM_TECHNIQUES).map(([k, label]) => ({ label, km: Number(counts[k].toFixed(2)) }));
  }, [entries]);

  const [showBackupText, setShowBackupText] = useState(false);
  const [importText, setImportText] = useState("");
  const [importMsg, setImportMsg] = useState("");
  const backupJson = useMemo(() => JSON.stringify({ entries, bodyStats, goal, library }, null, 2), [entries, bodyStats, goal, library]);

  const exportData = () => {
    const blob = new Blob([backupJson], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `tracky-backup-${todayISO()}.json`;
    a.click();
  };
  const copyBackupText = async () => {
    try {
      await navigator.clipboard.writeText(backupJson);
      setImportMsg("In Zwischenablage kopiert.");
    } catch {
      setImportMsg("Kopieren automatisch nicht möglich – markiere den Text unten manuell und kopiere ihn per Hand.");
    }
  };
  const handleImportFile = (file) => {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try { onImportAll(JSON.parse(reader.result)); setImportMsg("Import erfolgreich."); } catch { setImportMsg("Datei konnte nicht gelesen werden."); }
    };
    reader.readAsText(file);
  };
  const importFromText = () => {
    try { onImportAll(JSON.parse(importText)); setImportMsg("Import erfolgreich."); setImportText(""); }
    catch { setImportMsg("Text ist kein gültiges Backup-JSON."); }
  };

  return (
    <div className="ft-fade" style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <div className="ft-card">
        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10 }}>
          <TrendingUp size={16} color={C.signal} />
          <span className="ft-display" style={{ fontSize: 15, textTransform: "uppercase" }}>Trainingsvolumen · 8 Wochen</span>
        </div>
        <StackedBarChart data={weeklyData} series={Object.entries(DISCIPLINES).map(([key, d]) => ({ key, color: d.color, label: d.label }))} height={160} />
      </div>

      <div className="ft-card">
        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10 }}>
          <Dumbbell size={16} color={C.signal} />
          <span className="ft-display" style={{ fontSize: 15, textTransform: "uppercase" }}>Sätze pro Muskelgruppe · diese Woche</span>
        </div>
        <HBarChart data={muscleVolume.map((d) => ({ label: d.label, value: d.sets }))} color={C.signal} />
        <span style={{ fontSize: 11, color: C.muted }}>Faustregel aus der Trainingswissenschaft: oft werden ca. 10–20 effektive Sätze/Woche pro Muskelgruppe für Muskelaufbau genannt – das ist aber individuell sehr unterschiedlich.</span>
      </div>

      <div className="ft-card">
        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10 }}>
          <Scale size={16} color={C.signal} />
          <span className="ft-display" style={{ fontSize: 15, textTransform: "uppercase" }}>Körpergewicht</span>
        </div>
        {weightData.length < 2 ? (
          <div style={{ color: C.muted, fontSize: 13 }}>Trag mindestens zwei Körperwerte ein, um einen Trend zu sehen.</div>
        ) : (
          <LineChartSimple data={weightData} color={C.signal} />
        )}
      </div>

      <div className="ft-card">
        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10 }}>
          <Trophy size={16} color={C.signal} />
          <span className="ft-display" style={{ fontSize: 15, textTransform: "uppercase" }}>Bestwerte</span>
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(2, 1fr)", gap: 10 }}>
          {[
            { label: "Längster Lauf", value: pr.run, unit: "km" },
            { label: "Längstes Schwimmen", value: pr.swim, unit: "km" },
            { label: "Schwerstes Gewicht", value: pr.gym, unit: "kg" },
          ].map((s) => (
            <div key={s.label} style={{ background: C.surface2, borderRadius: 8, padding: 10 }}>
              <div className="ft-mono" style={{ fontSize: 18, color: C.signal }}>{s.value || "–"}{s.value ? <span style={{ fontSize: 11, color: C.muted }}> {s.unit}</span> : ""}</div>
              <div style={{ fontSize: 10, color: C.muted, marginTop: 2 }}>{s.label}</div>
            </div>
          ))}
        </div>
      </div>

      <div className="ft-card">
        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10 }}>
          <TrendingUp size={16} color={C.signal} />
          <span className="ft-display" style={{ fontSize: 15, textTransform: "uppercase" }}>Bestzeiten</span>
        </div>
        {["run", "swim"].map((disc) => (
          <div key={disc} style={{ marginBottom: 10 }}>
            <span style={{ fontSize: 11, color: C.muted, textTransform: "uppercase" }}>{DISCIPLINES[disc].label}</span>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 8, marginTop: 6 }}>
              {personalBests[disc].map((pb) => (
                <div key={pb.distance} style={{ background: C.surface2, borderRadius: 8, padding: 8 }}>
                  <div className="ft-mono" style={{ fontSize: 14, color: pb.best ? C.signal : C.muted }}>{pb.best ? `${pb.best}min` : "–"}</div>
                  <div style={{ fontSize: 10, color: C.muted, marginTop: 2 }}>{pb.distance}km{pb.paceStr ? ` · ${pb.paceStr}` : ""}</div>
                </div>
              ))}
            </div>
          </div>
        ))}
        <span style={{ fontSize: 11, color: C.muted }}>Einträge werden mit ±3% Toleranz der jeweiligen Standard-Distanz zugeordnet.</span>
      </div>

      <div className="ft-card">
        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10 }}>
          <Waves size={16} color={C.signal} />
          <span className="ft-display" style={{ fontSize: 15, textTransform: "uppercase" }}>Kilometer pro Technik</span>
        </div>
        <HBarChart data={swimTechniqueVolume.map((d) => ({ label: d.label, value: d.km }))} color={DISCIPLINES.swim.color} unit="km" />
      </div>

      {padelStats.length > 0 && (
        <div className="ft-card">
          <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10 }}>
            <PadelIcon size={16} color={C.signal} />
            <span className="ft-display" style={{ fontSize: 15, textTransform: "uppercase" }}>Padel-Statistik</span>
          </div>
          <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
            {padelStats.map((p) => (
              <div key={p.name} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", background: C.surface2, borderRadius: 8, padding: "8px 10px" }}>
                <span style={{ fontSize: 13 }}>{p.name} <span style={{ color: C.muted, fontSize: 11 }}>{p.partner > 0 ? "· Partner" : "· Gegner"}</span></span>
                <span className="ft-mono" style={{ fontSize: 12, color: C.muted }}>
                  {p.wins}S–{p.losses}N{p.training ? ` · ${p.training} Training` : ""}
                  {p.winRate != null && <span style={{ color: C.signal }}> · {p.winRate}%</span>}
                </span>
              </div>
            ))}
          </div>
        </div>
      )}

      <div className="ft-card">
        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10 }}>
          <Download size={16} color={C.signal} />
          <span className="ft-display" style={{ fontSize: 15, textTransform: "uppercase" }}>Backup</span>
        </div>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          <button className="ft-btn-ghost" style={{ display: "flex", alignItems: "center", gap: 6 }} onClick={exportData}><Download size={13} /> Als Datei</button>
          <button className="ft-btn-ghost" style={{ display: "flex", alignItems: "center", gap: 6 }} onClick={() => fileInputRef.current.click()}><Upload size={13} /> Datei importieren</button>
          <button className="ft-btn-ghost" onClick={() => setShowBackupText((v) => !v)}>{showBackupText ? "Text verbergen" : "Als Text anzeigen"}</button>
        </div>
        <input ref={fileInputRef} type="file" accept="application/json" style={{ display: "none" }} onChange={(e) => handleImportFile(e.target.files[0])} />
        <div style={{ fontSize: 10, color: C.muted, marginTop: 6 }}>Datei-Download funktioniert in manchen eingebetteten Ansichten nicht zuverlässig – falls "Als Datei" nichts sichtbares tut, nutze den Text darunter.</div>

        {showBackupText && (
          <div style={{ marginTop: 10, display: "flex", flexDirection: "column", gap: 6 }}>
            <textarea readOnly value={backupJson} onFocus={(e) => e.target.select()} className="ft-input ft-mono" style={{ height: 120, fontSize: 10, resize: "vertical" }} />
            <button className="ft-btn-ghost" style={{ alignSelf: "flex-start" }} onClick={copyBackupText}>In Zwischenablage kopieren</button>

            <span style={{ fontSize: 12, color: C.muted, marginTop: 10 }}>Backup-Text zum Wiederherstellen einfügen:</span>
            <textarea value={importText} onChange={(e) => setImportText(e.target.value)} placeholder="Backup-JSON hier einfügen…" className="ft-input ft-mono" style={{ height: 100, fontSize: 10, resize: "vertical" }} />
            <button className="ft-btn" style={{ alignSelf: "flex-start", padding: "8px 14px" }} onClick={importFromText}>Aus Text importieren</button>
          </div>
        )}
        {importMsg && <div style={{ fontSize: 11, color: C.signal, marginTop: 8 }}>{importMsg}</div>}
      </div>
    </div>
  );
}

// ---------- Ernährung ----------
function Nutrition({ foodEntries, foodLibrary, nutritionGoal, bodyStats, entries, onAddFoodEntry, onDeleteFoodEntry, onAddFoodLibItem, onUpdateFoodLibItem, onRemoveFoodLibItem, onUpdateGoal }) {
  const [tab, setTab] = useState("heute");
  const [showLibManage, setShowLibManage] = useState(false);
  const [selectedFood, setSelectedFood] = useState("");
  const [grams, setGrams] = useState("");
  const [mealType, setMealType] = useState("fruehstueck");
  const [newFood, setNewFood] = useState({ name: "", calories: "", protein: "", carbs: "", fat: "", fiber: "", colorTags: [] });
  const [editingFoodName, setEditingFoodName] = useState(null);
  const [editDraft, setEditDraft] = useState(null);
  const [photoLoading, setPhotoLoading] = useState(false);
  const [photoError, setPhotoError] = useState(null);
  const [pendingPhotoFood, setPendingPhotoFood] = useState(null);
  const [recipeLoading, setRecipeLoading] = useState(false);
  const [recipeError, setRecipeError] = useState(null);
  const [recipe, setRecipe] = useState(null);

  const latestWeight = useMemo(() => {
    const sorted = [...bodyStats].sort((a, b) => a.date.localeCompare(b.date));
    return sorted.length ? sorted[sorted.length - 1].weight : 75;
  }, [bodyStats]);

  const weeklyHours = useMemo(() => getLastWeekTrainingHours(entries), [entries]);
  const { adjustment, note: adjustmentNote } = useMemo(() => getWeeklyAdjustment(bodyStats, entries, nutritionGoal), [bodyStats, entries, nutritionGoal]);
  const targets = useMemo(() => computeMacroTargets(latestWeight, weeklyHours, nutritionGoal, adjustment), [latestWeight, weeklyHours, nutritionGoal, adjustment]);

  const todayEntries = foodEntries.filter((f) => f.date === todayISO());
  const consumed = todayEntries.reduce((acc, f) => ({
    calories: acc.calories + f.calories, protein: acc.protein + f.protein, carbs: acc.carbs + f.carbs, fat: acc.fat + f.fat, fiber: acc.fiber + f.fiber,
  }), { calories: 0, protein: 0, carbs: 0, fat: 0, fiber: 0 });
  const todayColors = new Set(todayEntries.flatMap((f) => f.colorTags || []));

  const addLibItem = () => {
    if (!newFood.name.trim()) return;
    onAddFoodLibItem({
      name: newFood.name.trim(), calories: Number(newFood.calories) || 0, protein: Number(newFood.protein) || 0,
      carbs: Number(newFood.carbs) || 0, fat: Number(newFood.fat) || 0, fiber: Number(newFood.fiber) || 0, colorTags: newFood.colorTags,
    });
    setNewFood({ name: "", calories: "", protein: "", carbs: "", fat: "", fiber: "", colorTags: [] });
  };
  const toggleNewFoodColor = (c) => setNewFood((f) => ({ ...f, colorTags: f.colorTags.includes(c) ? f.colorTags.filter((x) => x !== c) : [...f.colorTags, c] }));
  const startEditLib = (item) => { setEditingFoodName(item.name); setEditDraft({ ...item, calories: String(item.calories), protein: String(item.protein), carbs: String(item.carbs), fat: String(item.fat), fiber: String(item.fiber) }); };
  const toggleEditColor = (c) => setEditDraft((d) => ({ ...d, colorTags: d.colorTags.includes(c) ? d.colorTags.filter((x) => x !== c) : [...d.colorTags, c] }));
  const saveEditLib = () => {
    onUpdateFoodLibItem(editingFoodName, { name: editDraft.name.trim(), calories: Number(editDraft.calories) || 0, protein: Number(editDraft.protein) || 0, carbs: Number(editDraft.carbs) || 0, fat: Number(editDraft.fat) || 0, fiber: Number(editDraft.fiber) || 0, colorTags: editDraft.colorTags });
    setEditingFoodName(null); setEditDraft(null);
  };

  const submitFoodEntry = () => {
    const item = foodLibrary.find((f) => f.name === selectedFood);
    if (!item || !grams) return;
    const factor = Number(grams) / 100;
    onAddFoodEntry({
      id: Date.now(), date: todayISO(), name: item.name, grams: Number(grams), mealType,
      calories: Math.round(item.calories * factor), protein: Math.round(item.protein * factor),
      carbs: Math.round(item.carbs * factor), fat: Math.round(item.fat * factor), fiber: Math.round(item.fiber * factor),
      colorTags: item.colorTags || [], source: "manual",
    });
    setSelectedFood(""); setGrams("");
  };

  const handlePhotoFile = async (file) => {
    if (!file) return;
    setPhotoLoading(true); setPhotoError(null); setPendingPhotoFood(null);
    try {
      const base64 = await new Promise((resolve, reject) => {
        const r = new FileReader();
        r.onload = () => resolve(r.result.split(",")[1]);
        r.onerror = reject;
        r.readAsDataURL(file);
      });
      const prompt = `Analysiere das Foto einer Mahlzeit. Schätze Portionsgröße und Nährwerte für die gesamte sichtbare Portion (nicht pro 100g). Antworte NUR mit JSON, keine Erklärung, kein Markdown: {"name": "kurzer Name", "calories": number, "protein": number, "carbs": number, "fat": number, "fiber": number, "colorTags": ["Auswahl aus: Grün, Rot, Orange/Gelb, Blau/Violett, Weiß/Braun"]}`;
      const result = await callClaudeJSON(prompt, base64);
      setPendingPhotoFood({ name: result.name || "Foto-Schätzung", calories: Math.round(result.calories) || 0, protein: Math.round(result.protein) || 0, carbs: Math.round(result.carbs) || 0, fat: Math.round(result.fat) || 0, fiber: Math.round(result.fiber) || 0, colorTags: result.colorTags || [] });
    } catch {
      setPhotoError("Foto-Schätzung ist fehlgeschlagen (z.B. weil in dieser Umgebung kein Netzwerkzugriff möglich war). Trag die Mahlzeit gern manuell ein.");
    } finally {
      setPhotoLoading(false);
    }
  };
  const confirmPhotoFood = () => {
    if (!pendingPhotoFood) return;
    onAddFoodEntry({ id: Date.now(), date: todayISO(), name: pendingPhotoFood.name, grams: null, mealType, ...pendingPhotoFood, source: "photo-ai" });
    setPendingPhotoFood(null);
  };

  const generateRecipe = async () => {
    setRecipeLoading(true); setRecipeError(null); setRecipe(null);
    const remaining = { calories: Math.max(0, targets.calories - consumed.calories), protein: Math.max(0, targets.protein - consumed.protein), carbs: Math.max(0, targets.carbs - consumed.carbs), fat: Math.max(0, targets.fat - consumed.fat), fiber: Math.max(0, targets.fiber - consumed.fiber) };
    const prompt = `Ich habe heute noch ca. ${remaining.calories} kcal, ${remaining.protein}g Protein, ${remaining.carbs}g Kohlenhydrate, ${remaining.fat}g Fett und ${remaining.fiber}g Ballaststoffe übrig. Mein Ziel: ${NUTRITION_GOALS[nutritionGoal]}. Ich möchte möglichst günstig, ballaststoffreich, mikronährstoffreich (bunt/vielfältig) und darmfreundlich essen. Schlage EIN einfaches, günstiges Rezept vor, das gut in dieses Budget passt. Antworte NUR mit JSON, keine Erklärung, kein Markdown: {"title": "...", "ingredients": ["..."], "steps": ["..."], "estCalories": number, "estProtein": number, "estCarbs": number, "estFat": number}`;
    try {
      const result = await callClaudeJSON(prompt);
      setRecipe(result);
    } catch {
      setRecipeError("Rezeptvorschlag ist fehlgeschlagen (vermutlich kein Netzwerkzugriff in dieser Umgebung möglich).");
    } finally {
      setRecipeLoading(false);
    }
  };

  const Bar = ({ label, value, target, unit }) => (
    <div style={{ marginBottom: 8 }}>
      <div style={{ display: "flex", justifyContent: "space-between", fontSize: 11, color: C.muted, marginBottom: 3 }}>
        <span>{label}</span>
        <span className="ft-mono">{value}/{target}{unit}</span>
      </div>
      <div style={{ height: 6, background: C.surface2, borderRadius: 4, overflow: "hidden" }}>
        <div style={{ height: "100%", width: `${Math.min(100, (value / target) * 100)}%`, background: value > target ? C.yellow : C.signal }} />
      </div>
    </div>
  );

  return (
    <div className="ft-fade" style={{ display: "flex", flexDirection: "column", gap: 14 }}>
      <div style={{ display: "flex", gap: 4 }}>
        {[["heute", "Heute"], ["verlauf", "Verlauf"], ["bibliothek", "Bibliothek"]].map(([k, l]) => (
          <button key={k} className={`ft-tab ${tab === k ? "active" : ""}`} onClick={() => setTab(k)}><span className="dot" />{l}</button>
        ))}
      </div>

      {tab === "heute" && (
        <>
          <div className="ft-card">
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
              <span className="ft-display" style={{ fontSize: 15, textTransform: "uppercase" }}>Tagesziele</span>
              <select className="ft-input" style={{ width: "auto", padding: "6px 8px", fontSize: 12 }} value={nutritionGoal} onChange={(e) => onUpdateGoal(e.target.value)}>
                {Object.entries(NUTRITION_GOALS).map(([k, l]) => <option key={k} value={k}>{l}</option>)}
              </select>
            </div>
            <Bar label="Kalorien" value={consumed.calories} target={targets.calories} unit="kcal" />
            <Bar label="Protein" value={consumed.protein} target={targets.protein} unit="g" />
            <Bar label="Kohlenhydrate" value={consumed.carbs} target={targets.carbs} unit="g" />
            <Bar label="Fett" value={consumed.fat} target={targets.fat} unit="g" />
            <Bar label="Ballaststoffe" value={consumed.fiber} target={targets.fiber} unit="g" />
            {adjustmentNote && <div style={{ fontSize: 11, color: C.muted, marginTop: 6 }}>{adjustmentNote}</div>}
            <div style={{ fontSize: 10, color: C.muted, marginTop: 8 }}>Grobe Schätzung aus Körpergewicht + Trainingsvolumen, kein medizinischer Rat.</div>
          </div>

          <div className="ft-card">
            <span className="ft-display" style={{ fontSize: 13, textTransform: "uppercase" }}>Buntheit heute</span>
            <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginTop: 8 }}>
              {COLOR_TAGS.map((c) => (
                <span key={c} className="btn-chip" style={{ borderRadius: 999, padding: "5px 10px", fontSize: 11, border: `1px solid ${todayColors.has(c) ? C.signal : C.border}`, color: todayColors.has(c) ? C.text : C.muted, background: todayColors.has(c) ? C.surface2 : "transparent" }}>{c}</span>
              ))}
            </div>
            <div style={{ fontSize: 11, color: C.muted, marginTop: 6 }}>{todayColors.size}/5 Farbgruppen – Proxy für Mikronährstoff-Vielfalt statt exakter µg-Werte.</div>
          </div>

          <div className="ft-card" style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            <span className="ft-display" style={{ fontSize: 13, textTransform: "uppercase" }}>Essen hinzufügen</span>
            <div style={{ display: "flex", gap: 6 }}>
              <select className="ft-input" style={{ flex: 2 }} value={selectedFood} onChange={(e) => setSelectedFood(e.target.value)}>
                <option value="">Lebensmittel wählen</option>
                {foodLibrary.map((f) => <option key={f.name} value={f.name}>{f.name}</option>)}
              </select>
              <input className="ft-input" style={{ flex: 1 }} placeholder="Gramm" type="number" value={grams} onChange={(e) => setGrams(e.target.value)} />
            </div>
            <select className="ft-input" value={mealType} onChange={(e) => setMealType(e.target.value)}>
              {Object.entries(MEAL_TYPES).map(([k, l]) => <option key={k} value={k}>{l}</option>)}
            </select>
            <button className="ft-btn" onClick={submitFoodEntry}><Plus size={16} /> Eintragen</button>
            {foodLibrary.length === 0 && <span style={{ fontSize: 12, color: C.muted }}>Noch keine Lebensmittel angelegt – unten in der Bibliothek hinzufügen.</span>}

            <label className="ft-btn-ghost" style={{ display: "flex", alignItems: "center", gap: 8, justifyContent: "center", cursor: "pointer", marginTop: 4 }}>
              {photoLoading ? <Loader2 size={14} className="ft-mono" /> : <Camera size={14} />}
              {photoLoading ? "Schätze…" : "Foto von Mahlzeit"}
              <input type="file" accept="image/*" capture="environment" style={{ display: "none" }} onChange={(e) => handlePhotoFile(e.target.files[0])} />
            </label>
            {photoError && <span style={{ fontSize: 11, color: C.signal }}>{photoError}</span>}
            {pendingPhotoFood && (
              <div className="ft-card" style={{ background: C.surface2 }}>
                <div style={{ fontSize: 12, color: C.muted, marginBottom: 4 }}>KI-Schätzung, bitte prüfen:</div>
                <div className="ft-mono" style={{ fontSize: 13 }}>{pendingPhotoFood.name}: {pendingPhotoFood.calories}kcal · {pendingPhotoFood.protein}g P · {pendingPhotoFood.carbs}g KH · {pendingPhotoFood.fat}g F · {pendingPhotoFood.fiber}g Ballaststoffe</div>
                <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
                  <button className="ft-btn" style={{ padding: "8px 12px" }} onClick={confirmPhotoFood}>Übernehmen</button>
                  <button className="ft-btn-ghost" onClick={() => setPendingPhotoFood(null)}>Verwerfen</button>
                </div>
              </div>
            )}
          </div>

          <div className="ft-card" style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <span className="ft-display" style={{ fontSize: 13, textTransform: "uppercase" }}>Rezept-Idee</span>
              <button className="ft-btn-ghost" style={{ display: "flex", alignItems: "center", gap: 6 }} onClick={generateRecipe} disabled={recipeLoading}>
                {recipeLoading ? <Loader2 size={13} /> : <Sparkles size={13} />} Vorschlag
              </button>
            </div>
            {recipeError && <span style={{ fontSize: 11, color: C.signal }}>{recipeError}</span>}
            {recipe && (
              <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
                <span style={{ fontWeight: 700, fontSize: 14 }}>{recipe.title}</span>
                <span className="ft-mono" style={{ fontSize: 11, color: C.muted }}>~{recipe.estCalories}kcal · {recipe.estProtein}g P · {recipe.estCarbs}g KH · {recipe.estFat}g F</span>
                <ul style={{ margin: "4px 0", paddingLeft: 18, fontSize: 12, color: C.text }}>
                  {(recipe.ingredients || []).map((i, idx) => <li key={idx}>{i}</li>)}
                </ul>
                <ol style={{ margin: 0, paddingLeft: 18, fontSize: 12, color: C.muted }}>
                  {(recipe.steps || []).map((s, idx) => <li key={idx}>{s}</li>)}
                </ol>
              </div>
            )}
          </div>

          {todayEntries.length > 0 && (
            <div className="ft-card">
              <span className="ft-display" style={{ fontSize: 13, textTransform: "uppercase" }}>Heute gegessen</span>
              <div style={{ display: "flex", flexDirection: "column", gap: 6, marginTop: 8 }}>
                {todayEntries.map((f) => (
                  <div key={f.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                    <span style={{ fontSize: 12 }}>{f.name}{f.grams ? ` (${f.grams}g)` : ""} <span style={{ color: C.muted }}>· {MEAL_TYPES[f.mealType]}</span></span>
                    <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                      <span className="ft-mono" style={{ fontSize: 11, color: C.muted }}>{f.calories}kcal</span>
                      <X size={13} style={{ cursor: "pointer", color: C.muted }} onClick={() => onDeleteFoodEntry(f.id)} />
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}
        </>
      )}

      {tab === "verlauf" && (
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          {foodEntries.length === 0 ? (
            <div className="ft-card empty" style={{ textAlign: "center", color: C.muted, fontSize: 13 }}>Noch keine Einträge.</div>
          ) : (
            [...foodEntries].sort((a, b) => b.date.localeCompare(a.date) || b.id - a.id).map((f) => (
              <div key={f.id} className="ft-card" style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                <div>
                  <div style={{ fontSize: 13 }}>{f.name}{f.grams ? ` (${f.grams}g)` : ""}</div>
                  <div className="ft-mono" style={{ fontSize: 11, color: C.muted }}>{fmtDate(f.date)} · {MEAL_TYPES[f.mealType]} · {f.calories}kcal · {f.protein}g P · {f.carbs}g KH · {f.fat}g F</div>
                </div>
                <X size={14} style={{ cursor: "pointer", color: C.muted, flexShrink: 0 }} onClick={() => onDeleteFoodEntry(f.id)} />
              </div>
            ))
          )}
        </div>
      )}

      {tab === "bibliothek" && (
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          <div className="ft-card" style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            <span style={{ fontSize: 12, color: C.muted }}>Neues Lebensmittel (Werte pro 100g)</span>
            <input className="ft-input" placeholder="Name" value={newFood.name} onChange={(e) => setNewFood({ ...newFood, name: e.target.value })} />
            <div style={{ display: "flex", gap: 6 }}>
              <input className="ft-input" placeholder="kcal" type="number" value={newFood.calories} onChange={(e) => setNewFood({ ...newFood, calories: e.target.value })} />
              <input className="ft-input" placeholder="Protein g" type="number" value={newFood.protein} onChange={(e) => setNewFood({ ...newFood, protein: e.target.value })} />
              <input className="ft-input" placeholder="KH g" type="number" value={newFood.carbs} onChange={(e) => setNewFood({ ...newFood, carbs: e.target.value })} />
            </div>
            <div style={{ display: "flex", gap: 6 }}>
              <input className="ft-input" placeholder="Fett g" type="number" value={newFood.fat} onChange={(e) => setNewFood({ ...newFood, fat: e.target.value })} />
              <input className="ft-input" placeholder="Ballaststoffe g" type="number" value={newFood.fiber} onChange={(e) => setNewFood({ ...newFood, fiber: e.target.value })} />
            </div>
            <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
              {COLOR_TAGS.map((c) => (
                <button key={c} className={`ft-btn-ghost ${newFood.colorTags.includes(c) ? "on" : ""}`} style={{ padding: "4px 10px", fontSize: 11 }} onClick={() => toggleNewFoodColor(c)}>{c}</button>
              ))}
            </div>
            <button className="ft-btn" onClick={addLibItem}><Plus size={14} /> Hinzufügen</button>
          </div>

          {foodLibrary.map((item) => (
            editingFoodName === item.name ? (
              <div key={item.name} className="ft-card" style={{ background: C.surface2, display: "flex", flexDirection: "column", gap: 6 }}>
                <input className="ft-input" value={editDraft.name} onChange={(e) => setEditDraft({ ...editDraft, name: e.target.value })} />
                <div style={{ display: "flex", gap: 6 }}>
                  <input className="ft-input" placeholder="kcal" type="number" value={editDraft.calories} onChange={(e) => setEditDraft({ ...editDraft, calories: e.target.value })} />
                  <input className="ft-input" placeholder="Protein" type="number" value={editDraft.protein} onChange={(e) => setEditDraft({ ...editDraft, protein: e.target.value })} />
                  <input className="ft-input" placeholder="KH" type="number" value={editDraft.carbs} onChange={(e) => setEditDraft({ ...editDraft, carbs: e.target.value })} />
                </div>
                <div style={{ display: "flex", gap: 6 }}>
                  <input className="ft-input" placeholder="Fett" type="number" value={editDraft.fat} onChange={(e) => setEditDraft({ ...editDraft, fat: e.target.value })} />
                  <input className="ft-input" placeholder="Ballaststoffe" type="number" value={editDraft.fiber} onChange={(e) => setEditDraft({ ...editDraft, fiber: e.target.value })} />
                </div>
                <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                  {COLOR_TAGS.map((c) => (
                    <button key={c} className={`ft-btn-ghost ${editDraft.colorTags.includes(c) ? "on" : ""}`} style={{ padding: "4px 10px", fontSize: 11 }} onClick={() => toggleEditColor(c)}>{c}</button>
                  ))}
                </div>
                <div style={{ display: "flex", gap: 8 }}>
                  <button className="ft-btn" style={{ padding: "8px 12px" }} onClick={saveEditLib}><Check size={14} /></button>
                  <button className="ft-btn-ghost" onClick={() => setEditingFoodName(null)}><X size={14} /></button>
                </div>
              </div>
            ) : (
              <div key={item.name} className="ft-card" style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                <div>
                  <div style={{ fontSize: 13 }}>{item.name}</div>
                  <div className="ft-mono" style={{ fontSize: 11, color: C.muted }}>{item.calories}kcal · {item.protein}g P · {item.carbs}g KH · {item.fat}g F · {item.fiber}g Ballast./100g</div>
                </div>
                <div style={{ display: "flex", gap: 8 }}>
                  <Pencil size={13} style={{ cursor: "pointer", color: C.muted }} onClick={() => startEditLib(item)} />
                  <X size={14} style={{ cursor: "pointer", color: C.muted }} onClick={() => onRemoveFoodLibItem(item.name)} />
                </div>
              </div>
            )
          ))}
        </div>
      )}
    </div>
  );
}

// ---------- app ----------
function App() {
  const [entries, setEntries] = useState([]);
  const [bodyStats, setBodyStats] = useState([]);
  const [goal, setGoal] = useState(null);
  const [exerciseLibrary, setExerciseLibrary] = useState([]);
  const [playerLibrary, setPlayerLibrary] = useState([]);
  const [foodEntries, setFoodEntries] = useState([]);
  const [foodLibrary, setFoodLibrary] = useState([]);
  const [nutritionGoal, setNutritionGoal] = useState("erhalt");
  const [view, setView] = useState("log");
  const [loading, setLoading] = useState(true);
  const [editingEntry, setEditingEntry] = useState(null);
  const [storageCheck, setStorageCheck] = useState(null);
  const [bannerDismissed, setBannerDismissed] = useState(false);

  const runStorageCheck = async () => setStorageCheck(await testStoragePersistence());

  useEffect(() => {
    (async () => {
      const [e, b, g, lib, players, foodE, foodLib, nutGoal, check] = await Promise.all([
        loadKey("entries", []),
        loadKey("bodystats", []),
        loadKey("goal", null),
        loadKey("exercise-library", []),
        loadKey("player-library", []),
        loadKey("food-entries", []),
        loadKey("food-library", []),
        loadKey("nutrition-goal", "erhalt"),
        testStoragePersistence(),
      ]);
      // Altes Format (reine Namensliste) auf {name, muscleGroup, repLow, repHigh} migrieren
      const migratedLib = (lib || []).length === 0 ? SEED_EXERCISES : (lib || []).map((item) => (typeof item === "string" ? { name: item, muscleGroup: "", repLow: 6, repHigh: 8 } : item));
      setEntries(e); setBodyStats(b); setGoal(g); setExerciseLibrary(migratedLib); setPlayerLibrary(players || []);
      setFoodEntries(foodE || []); setFoodLibrary(foodLib || []); setNutritionGoal(nutGoal || "erhalt");
      setStorageCheck(check);
      if (JSON.stringify(migratedLib) !== JSON.stringify(lib)) saveKey("exercise-library", migratedLib);
      setLoading(false);
    })();
  }, []);

  const addEntry = (entry) => { const next = [...entries, entry]; setEntries(next); saveKey("entries", next); };
  const updateEntry = (entry) => { const next = entries.map((e) => (e.id === entry.id ? entry : e)); setEntries(next); saveKey("entries", next); setEditingEntry(null); setView("history"); };
  const deleteEntry = (id) => { const next = entries.filter((e) => e.id !== id); setEntries(next); saveKey("entries", next); };
  const addBodyStat = (stat) => { const next = [...bodyStats, stat]; setBodyStats(next); saveKey("bodystats", next); };
  const updateGoal = (g) => { setGoal(g); saveKey("goal", g); };
  const startEdit = (entry) => { setEditingEntry(entry); setView("log"); };
  const cancelEdit = () => setEditingEntry(null);

  const addPlayer = (name) => {
    if (!name.trim() || playerLibrary.includes(name)) return;
    const next = [...playerLibrary, name];
    setPlayerLibrary(next); saveKey("player-library", next);
  };
  const removePlayer = (name) => {
    const next = playerLibrary.filter((n) => n !== name);
    setPlayerLibrary(next); saveKey("player-library", next);
  };

  const addFoodEntry = (entry) => { const next = [...foodEntries, entry]; setFoodEntries(next); saveKey("food-entries", next); };
  const deleteFoodEntry = (id) => { const next = foodEntries.filter((f) => f.id !== id); setFoodEntries(next); saveKey("food-entries", next); };
  const addFoodLibItem = (item) => {
    if (foodLibrary.some((f) => f.name === item.name)) return;
    const next = [...foodLibrary, item]; setFoodLibrary(next); saveKey("food-library", next);
  };
  const removeFoodLibItem = (name) => { const next = foodLibrary.filter((f) => f.name !== name); setFoodLibrary(next); saveKey("food-library", next); };
  const updateFoodLibItem = (oldName, newItem) => {
    const next = foodLibrary.map((f) => (f.name === oldName ? newItem : f));
    setFoodLibrary(next); saveKey("food-library", next);
  };
  const updateNutritionGoal = (g) => { setNutritionGoal(g); saveKey("nutrition-goal", g); };

  const addLibraryItem = (item) => {
    if (!item.name.trim() || exerciseLibrary.some((l) => l.name === item.name)) return;
    const next = [...exerciseLibrary, item];
    setExerciseLibrary(next); saveKey("exercise-library", next);
  };
  const removeLibraryItem = (name) => {
    const next = exerciseLibrary.filter((l) => l.name !== name);
    setExerciseLibrary(next); saveKey("exercise-library", next);
  };
  // Umbenennen/Ändern einer Übung: wirkt auch auf bereits gespeicherte Einträge, damit
  // Verlauf und Progressionsvorschlag weiter zusammenpassen.
  const updateLibraryItem = (oldName, newItem) => {
    const next = exerciseLibrary.map((l) => (l.name === oldName ? newItem : l));
    setExerciseLibrary(next); saveKey("exercise-library", next);
    if (newItem.name !== oldName) {
      const newEntries = entries.map((e) => e.discipline === "gym"
        ? { ...e, exercises: (e.exercises || []).map((ex) => (ex.name === oldName ? { ...ex, name: newItem.name } : ex)) }
        : e);
      setEntries(newEntries); saveKey("entries", newEntries);
    }
  };

  const importAll = (data) => {
    const e = data.entries || [], b = data.bodyStats || [], g = data.goal || null, lib = data.library || [];
    setEntries(e); setBodyStats(b); setGoal(g); setExerciseLibrary(lib);
    saveKey("entries", e); saveKey("bodystats", b); saveKey("goal", g); saveKey("exercise-library", lib);
  };

  const views = [
    { key: "log", label: "Eintragen", icon: Plus },
    { key: "history", label: "Verlauf", icon: ListChecks },
    { key: "progress", label: "Fortschritt", icon: Flame },
    { key: "nutrition", label: "Ernährung", icon: Apple },
  ];

  if (loading) {
    return (
      <div className="ft-root" style={{ display: "flex", alignItems: "center", justifyContent: "center", height: "100vh" }}>
        <GlobalStyle />
        <span className="ft-mono" style={{ color: C.muted }}>Lade…</span>
      </div>
    );
  }

  return (
    <div className="ft-root">
      <GlobalStyle />
      <div style={{ maxWidth: 640, margin: "0 auto", padding: "20px 16px 90px", display: "flex", flexDirection: "column", gap: 18 }}>
        <div>
          <div className="ft-display" style={{ fontSize: 30, lineHeight: 1 }}>TRACK<span style={{ color: C.signal }}>Y</span></div>
          <div style={{ fontSize: 12, color: C.muted, marginTop: 2 }}>Gym · Laufen · Schwimmen · Padel</div>
        </div>

        {storageCheck && !storageCheck.ok && !bannerDismissed && (
          <div style={{ display: "flex", alignItems: "center", gap: 8, background: C.surface2, border: `1px solid ${C.red}`, borderRadius: 10, padding: "8px 10px", fontSize: 11.5 }}>
            <span style={{ color: C.red, flexShrink: 0 }}>⚠️</span>
            <span style={{ flex: 1, color: C.muted }}>
              Speicher gestört – Eingaben evtl. nicht gespeichert. <span style={{ color: C.text, textDecoration: "underline", cursor: "pointer" }} onClick={runStorageCheck}>Erneut prüfen</span>
            </span>
            <X size={14} style={{ cursor: "pointer", color: C.muted, flexShrink: 0 }} onClick={() => setBannerDismissed(true)} />
          </div>
        )}

        <Ticker entries={entries} bodyStats={bodyStats} goal={goal} onEditGoal={updateGoal} />

        {view === "log" && (
          <LogForm
            onAddEntry={addEntry} onUpdateEntry={updateEntry} onAddBodyStat={addBodyStat}
            entries={entries} library={exerciseLibrary}
            onAddLibraryItem={addLibraryItem} onUpdateLibraryItem={updateLibraryItem} onRemoveLibraryItem={removeLibraryItem}
            playerLibrary={playerLibrary} onAddPlayer={addPlayer} onRemovePlayer={removePlayer}
            editingEntry={editingEntry} onCancelEdit={cancelEdit} goal={goal}
          />
        )}
        {view === "history" && <History entries={entries} onDelete={deleteEntry} onEdit={startEdit} />}
        {view === "progress" && <Progress entries={entries} bodyStats={bodyStats} library={exerciseLibrary} goal={goal} onImportAll={importAll} />}
        {view === "nutrition" && (
          <Nutrition
            foodEntries={foodEntries} foodLibrary={foodLibrary} nutritionGoal={nutritionGoal} bodyStats={bodyStats} entries={entries}
            onAddFoodEntry={addFoodEntry} onDeleteFoodEntry={deleteFoodEntry}
            onAddFoodLibItem={addFoodLibItem} onUpdateFoodLibItem={updateFoodLibItem} onRemoveFoodLibItem={removeFoodLibItem}
            onUpdateGoal={updateNutritionGoal}
          />
        )}
      </div>

      <div style={{ position: "fixed", bottom: 0, left: 0, right: 0, background: C.surface, borderTop: `1px solid ${C.border}`, display: "flex", padding: "6px 10px", maxWidth: 640, margin: "0 auto" }}>
        {views.map((v) => {
          const Icon = v.icon;
          const active = view === v.key;
          return (
            <button key={v.key} className={`ft-tab ${active ? "active" : ""}`} onClick={() => setView(v.key)}>
              <Icon size={18} color={active ? C.signal : C.muted} />
              {v.label}
            </button>
          );
        })}
      </div>
    </div>
  );
}

const __root = ReactDOM.createRoot(document.getElementById("root"));
__root.render(<App />);

  </script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
    }
  </script>
</body>
</html>
